<!DOCTYPE html>
<html>
<head>
    <title>Live Network Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f7f8fb;
            color: #2c2f33;
        }

        h1 {
            margin-bottom: 12px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: minmax(180px, auto) minmax(320px, 1fr) minmax(320px, 1fr);
            gap: 20px;
            margin-bottom: 24px;
            align-items: start;
        }

        .summary-cards {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: start;
        }

        .card,
        .graph-card,
        .table-card {
            background: #ffffff;
            border: 1px solid #dfe2e6;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(44, 47, 51, 0.06);
            padding: 18px;
        }

        .card {
            width: 100%;
            min-width: 140px;
            max-width: 220px;
        }

        .total-devices-card p {
            margin: 0;
            white-space: nowrap;
        }

        .card h3,
        .graph-card h3,
        .table-card h3 {
            margin: 0 0 10px;
            font-size: 1rem;
            color: #3f444f;
        }

        .card p {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            color: #1f2328;
            word-break: break-word;
        }

        .graph-card canvas {
            width: 100% !important;
            height: auto !important;
        }

        .device-status-card {
            min-width: 0;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background: #ffffff;
        }

        th,
        td {
            border: 1px solid #e2e5ea;
            padding: 10px 12px;
            text-align: left;
        }

        th {
            background: #eef1f6;
            color: #2c2f33;
            font-weight: 700;
        }

        tbody tr:nth-child(even) {
            background: #f9fbff;
        }

        .info-table {
            margin-top: 20px;
        }

        .table-card {
            overflow-x: auto;
            background: #ffffff;
            border: 1px solid #dfe2e6;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(44, 47, 51, 0.06);
            padding: 18px;
        }

        .dashboard-bottom {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
            gap: 20px;
            margin-top: 20px;
            align-items: start;
        }

        .dashboard-bottom > * {
            min-width: 0;
        }

        .dashboard-bottom .table-card {
            padding: 16px;
            overflow: hidden;
        }

        .dashboard-bottom .hidden-devices-card {
            grid-column: 1 / -1;
        }

        .table-card table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th,
        td {
            border: 1px solid #e2e5ea;
            padding: 10px 12px;
            text-align: left;
            word-break: break-word;
            white-space: normal;
        }

        .table-card h3,
        .info-table h3,
        .graph-card h3 {
            margin-bottom: 16px;
        }

        .graph-card {
            display: flex;
            flex-direction: column;
            min-height: 320px;
            max-height: 520px;
            background: #ffffff;
            border: 1px solid #dfe2e6;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(44, 47, 51, 0.06);
            padding: 18px;
            overflow: hidden;
        }

        .hide-button,
        .unhide-button,
        .toggle-hidden-button {
            padding: 6px 10px;
            border: 1px solid #dfe2e6;
            border-radius: 8px;
            background: #f4f5f7;
            color: #2c2f33;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .hide-button:hover,
        .unhide-button:hover,
        .toggle-hidden-button:hover {
            background: #e8eaed;
        }

        .hidden-devices-card .hidden-content {
            display: none;
            margin-top: 16px;
            overflow-x: auto;
            max-height: 340px;
        }

        .hidden-devices-card.open .hidden-content {
            display: block;
        }

        .hidden-devices-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .graph-card canvas {
            width: 100% !important;
            height: 100% !important;
            flex: 1;
            min-height: 260px !important;
            max-height: 480px !important;
        }

        .info-table {
            margin-top: 0;
        }

        .info-table table {
            margin-top: 0;
        }
    </style>
</head>
<body>

<h1>Live Network Dashboard</h1>

<div class="dashboard">
    <div class="summary-cards">
        <div class="card total-devices-card">
            <h3>Total Devices</h3>
            <p id="count">0</p>
        </div>
        <div class="card" style="display:flex;align-items:center;justify-content:space-between;min-width:180px;">
            <div>
                <h3 style="margin:0 0 6px 0;font-size:0.95rem;">Packet Sniffer</h3>
                <div id="snifferStatus" style="font-size:0.9rem;color:#58606a;">Unknown</div>
            </div>
            <div>
                <button id="snifferToggle" class="sniffer-toggle-button">Toggle</button>
            </div>
        </div>
    </div>

    <div class="graph-card">
        <h3>Packet Usage</h3>
        <canvas id="packetUsageChart"></canvas>
    </div>

    <div class="graph-card device-status-card">
        <h3>Device Status</h3>
        <canvas id="statusChart"></canvas>
    </div>
</div>

<div class="dashboard-bottom">
    <div class="table-card">
        <h3>Live Device List</h3>
        <table>
            <thead>
                <tr>
                    <th>IP</th>
                    <th>Status</th>
                    <th>MAC</th>
                    <th>Manufacturer</th>
                    <th>Last Seen</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="deviceTable"></tbody>
        </table>
    </div>

    <div class="table-card info-table">
        <h3>Summary Metrics</h3>
        <table>
            <thead>
                <tr>
                    <th>Metric</th>
                    <th>Value</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Total Devices</td>
                    <td id="summaryTotal">0</td>
                </tr>
                <tr>
                    <td>Network Usage</td>
                    <td id="networkUsage">0s</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="table-card hidden-devices-card" id="hiddenDevicesCard">
        <div class="card-header">
            <h3>Hidden Devices</h3>
            <button class="toggle-hidden-button" id="toggleHiddenDevices">Show hidden devices</button>
        </div>
        <div class="hidden-content" id="hiddenDevicesContent">
            <table>
                <thead>
                    <tr>
                        <th>IP</th>
                        <th>Status</th>
                        <th>MAC</th>
                        <th>Manufacturer</th>
                        <th>Last Seen</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="hiddenDeviceTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="{{url_for('static', filename='chart.js')}}"></script>
<div style="margin:12px 0;padding:8px;background:#fff;border:1px solid #e2e5ea;border-radius:6px;">
    <strong>SSE Debug:</strong>
    <pre id="debugSSE" style="max-height:160px;overflow:auto;margin:8px 0;font-size:12px;color:#111;white-space:pre-wrap;word-break:break-word;max-width:100%;"></pre>
</div>
<script src = "{{url_for('static', filename='app.js')}}"></script>

</body>
</html>
